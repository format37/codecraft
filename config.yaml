# CodeCraft server - a self-hosted CodeCraft 2020 competition server.
# Every value here has a default (see server/codecraft/config.py); delete a key to fall back to it.
# Secrets and machine-specific values go to .env (see .env.example): CW_RESEND_API_KEY, CW_MAIL_FROM,
# CW_BASE_URL, CW_ADMINS, CW_SMTP_PASSWORD.

engine:
  image: codecraft/sim-cpp          # our own engine, open source: the official rules, command line and replays.
                                    # Without a tag, it is tagged with the version of its source, the hash of the
                                    # Dockerfile and the files it copies: a changed source (a git pull) is built
                                    # before the next game, and the game pages name the engine of every game. A tag
                                    # of its own pins the image: built when missing, whatever the source.
  context: sim-cpp                  # the directory its image is built from (a Dockerfile). The Python engine:
                                    # image codecraft/sim, context sim (the same games, minutes a game). Or
                                    # CW_ENGINE_IMAGE / CW_ENGINE_CONTEXT in .env
  memory_mb: 512
  cpus: 1.0
  startup_timeout_sec: 30           # how long to wait for the engine to open its TCP ports

# Limits for every strategy container ("time configuration"). Admins can override them per strategy.
# Official 2020 values: 1 s real time per tick, 40 s CPU time per game, 256 MB.
limits:
  tick_timeout_sec: 1.0             # engine-enforced: reply budget per tick (real seconds); null = unlimited
  cpu_time_sec: 40                  # RLIMIT_CPU on the strategy process (CPU seconds per game); null = unlimited
  memory_mb: 1024                   # docker memory cap; counts the whole container (a -Xmx250m JVM peaks at ~560 MB)
  cpus: 1.0                         # CPU cores per strategy container
  pids: 256
  accept_timeout_sec: 60            # how long the engine waits for a strategy to connect (JVM start-up is slow)
  game_wall_timeout_sec: null       # hard wall-clock cap per game; null = 1000 ticks * tick_timeout + slack

# Random game format choice in the sandbox (weights).
formats:
  Round1: 1                         # 4 players, no fog of war, all bases given
  Round2: 1                         # 4 players, fog of war, builders only
  Finals: 1                         # 1v1, fog of war

# Tournament points per place (ties share the sum, rounded down), as in 2020 (docs/tournament.md).
points:
  Round1: [8, 4, 2, 1]
  Round2: [8, 4, 2, 1]
  Finals: [2, 0]

matchmaking:
  rating_sigma: 200                 # opponents are drawn with weight exp(-|rating diff| / sigma)
  include_builtin: true             # the built-in QuickStart bot takes part as a regular (rated) player
  fill_with_builtin: true           # not enough strategies for a seat? use QuickStart (else an Empty seat)

rating:                             # one fit over every rated game: the ratings that explain all results best, on
  initial: 1200                     # the Elo scale (400 points = 10 to 1). What is rated is a build. The first build
  prior_sd: 350                     # of a strategy starts from `initial`, give or take prior_sd; each later build
  version_sd: 200                   # from the build before it, give or take version_sd. After a change of these:
                                    # ./cw rerate --history

leagues:                            # the ladder in groups of like strength (/rules, "Leagues"): once a week the settled
  count: 3                          # ratings are clustered into this many leagues, league 0 the strongest
  settled_games: 30                 # a rating is settled when its build has played this many rated games
  margin: 40                        # a strategy changes league when its rating is past a line by this much
  min_size: 1                       # the least strategies a league is drawn with

gpu:
  enabled: auto                     # true / false / auto = the nvidia runtime is registered in docker (or CW_GPU_ENABLED);
                                    # without a GPU the CUDA languages and the GPU option disappear from the UI
  max_per_game: 1                   # GPU strategies per game; each gets the whole GPU (fractions: later)

worker:                             # the `worker` service
  parallel_games: 1                 # a 4-player game uses ~5 cores at limits.cpus = 1
  pause_sec: 5
  sandbox: true                     # play rated sandbox games when no custom game is queued; gpu = only games of GPU
                                    # strategies (an executor kept for the GPU; or CW_WORKER_SANDBOX)
  sandbox_games_per_build: 30       # placement: every new build (version) plays this many sandbox games, one after
                                    # another; a third of them one on one, each against the opponent met least. 0 = none
  sandbox_interval_hours: 1         # after that a strategy is due a rated game once an interval: this many hours, and
                                    # N more of them for every N-th full week its build has been playing (1, 2, 4, 7,
  sandbox_interval_max_hours: 24    # 11, 16, 22 hours, the 2020 rule), up to this. Every sandbox game it is in counts,
                                    # a filler seat too. interval 0 = no games after the placement
  builds: true                      # build submitted versions (one at a time); gpu = only GPU versions (CW_WORKER_BUILDS)

# A strategy compiles in a container made from its language's base image: no network, these limits, no
# capabilities. The base image (template or official client Dockerfile) is built once per language with
# the network; `cw build` warms them all.
build:
  memory_mb: 6144                   # GraalVM native-image needs the most
  cpus: 4.0
  pids: 1024
  timeout_sec: 1200                 # hard wall clock per compile, the container is killed after it
  log_max_mb: 16                    # the build log keeps its last this-many MB

submissions:
  max_zip_mb: 20
  max_files: 2000
  max_unpacked_mb: 200
  languages: null                   # null = every templates/<lang> and clients/<Lang>; or a list, e.g. [python, cpp, java]
  allow_git: true                   # public repositories on git_hosts
  git_hosts: [github.com, gitlab.com, bitbucket.org, codeberg.org]   # https only, no port; shallow clones
  per_user_queued: 1                # versions waiting/building per user
  per_user_per_day: 20
  custom_games_queued: 3
  custom_games_per_day: 50

auth:
  registration: open                # open | invite (admin creates links) | closed (or CW_REGISTRATION)
  admins: []                        # e-mails that get the admin role on sign-in (or CW_ADMINS in .env)
  base_url: http://localhost:8080   # used in the sign-in mail link (or CW_BASE_URL)
  cookie_secure: auto               # auto = true when base_url is https (or CW_BASE_URL)
  session_ttl_days: 90
  code_ttl_minutes: 10
  code_attempts: 5

mail:
  provider: auto                    # auto = resend if CW_RESEND_API_KEY, else smtp if smtp.host, else console (log)
  from: "CodeCraft <onboarding@resend.dev>"
  smtp:
    host: null
    port: 587
    user: null
    starttls: true

web:
  host: 0.0.0.0
  port: 8080
  title: CodeCraft
  trusted_proxies: []               # reverse proxies whose X-Forwarded-For/-Proto count, e.g. [10.66.0.1]
                                    # (or CW_TRUSTED_PROXIES=a,b); [] = nobody's, the peer address is the client

community:                          # where the players talk: a link in the header, on the cover, on /agents and in
  name: Discord                     # the agents' whoami (or CW_COMMUNITY_URL in .env); url null = no link anywhere
  url: null
  discord_webhook: null             # a webhook of the announcements channel (CW_DISCORD_WEBHOOK in .env, never here):
                                    # the worker posts a strategy's first build, Monday's top ten, a new engine version

docker:
  prefix: cw                        # container and network names: cw-<game>-engine, cw-<game>-p<slot>, cw-<game>-s<slot>
  label: codecraft.game
  seat_subnets: 10.200.0.0/16       # every seat gets its own internal network (a /24 of this) shared only with the
                                    # engine; pick a range nothing on the host routes
  runtime: null                     # player and compile containers: e.g. runsc (gVisor, registered in daemon.json with
                                    # --overlay2=none), or env CW_DOCKER_RUNTIME; null = the daemon's default. A GPU
                                    # seat always uses the default. gVisor's own threads count in limits.pids (~30)

hub:                                # one machine does all, or the site on one (the hub) and the games on others (the
                                    # executors, which ask the hub for work); docs/hub.md
  url: null                         # an executor's hub (CW_HUB_URL); null = this machine has the database
  token: null                       # the shared secret (CW_HUB_TOKEN in .env, never here); a hub without it has no API
  lease_sec: 600                    # an executor silent this long loses its running games and builds to the queue
  offline_sec: 120                  # the site says the game server is offline after this silence
  replay_days: 30                   # the hub keeps a replay this long, the executor that played it for good; an older
                                    # one is fetched back when somebody opens it. 0 = the hub keeps them all
  gpu_alert_minutes: 10             # GPU work waiting this long with no GPU executor online: a Telegram message to the
                                    # operator (CW_TELEGRAM_TOKEN, CW_TELEGRAM_CHAT)

executor:
  name: null                        # how the hub knows this machine (CW_EXECUTOR_NAME); null = the host name
  heartbeat_sec: 15

hardening:                          # strategy containers (they already run on an internal network with limits)
  no_new_privileges: true
  cap_drop_all: true
