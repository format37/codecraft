# CodeCraft server. All services share one image and see the code read-only; only data/ is writable.
# The worker and the CLI drive the host docker daemon through its socket (game and build containers are
# created by the worker, not by compose); the web service, the one facing the internet, has no socket.
#
#   docker compose build
#   docker compose run --rm cli build          # engine, every language's base image, seed strategies (strategies/*.yaml)
#   docker compose up -d web worker            # UI on :8080; worker builds submissions and plays games
#   docker compose run --rm cli play --format Round2 --players format37-2020 thermit-2020 dragoonxen-2020 quickstart
#
# Or split in two (docs/hub.md): the site and the database on a small always-on machine (compose.hub.yml), the
# building and playing on machines with Docker that may be switched off (`docker compose up -d worker` with
# CW_HUB_URL and CW_HUB_TOKEN in .env).
#
# Mail for sign-in codes: set CW_RESEND_API_KEY (+ CW_MAIL_FROM) or configure mail.smtp in config.yaml;
# without either, codes are printed in the web service log (docker compose logs web).

name: codecraft                 # compose project name, independent of the folder name

x-server: &server
  build: ./server
  image: codecraft/server
  environment:
    CW_ROOT: /app
    CW_RESEND_API_KEY: ${CW_RESEND_API_KEY:-}
    CW_MAIL_FROM: ${CW_MAIL_FROM:-}
    CW_BASE_URL: ${CW_BASE_URL:-}
    CW_ADMINS: ${CW_ADMINS:-}
    CW_SMTP_PASSWORD: ${CW_SMTP_PASSWORD:-}
    CW_REGISTRATION: ${CW_REGISTRATION:-}
    CW_GPU_ENABLED: ${CW_GPU_ENABLED:-}
    CW_TRUSTED_PROXIES: ${CW_TRUSTED_PROXIES:-}
    CW_DOCKER_RUNTIME: ${CW_DOCKER_RUNTIME:-}
    CW_ENGINE_IMAGE: ${CW_ENGINE_IMAGE:-}
    CW_ENGINE_CONTEXT: ${CW_ENGINE_CONTEXT:-}
    CW_SENTRY_DSN: ${CW_SENTRY_DSN:-}
    CW_SENTRY_ENVIRONMENT: ${CW_SENTRY_ENVIRONMENT:-}
    CW_COMMUNITY_URL: ${CW_COMMUNITY_URL:-}
    CW_DISCORD_WEBHOOK: ${CW_DISCORD_WEBHOOK:-}
    # hub and executors (server/codecraft/hub.py, docs/hub.md)
    CW_HUB_URL: ${CW_HUB_URL:-}
    CW_HUB_TOKEN: ${CW_HUB_TOKEN:-}
    CW_EXECUTOR_NAME: ${CW_EXECUTOR_NAME:-}
    CW_WORKER_SANDBOX: ${CW_WORKER_SANDBOX:-}
    CW_WORKER_BUILDS: ${CW_WORKER_BUILDS:-}
    CW_PARALLEL_GAMES: ${CW_PARALLEL_GAMES:-}
    CW_TELEGRAM_TOKEN: ${CW_TELEGRAM_TOKEN:-}
    CW_TELEGRAM_CHAT: ${CW_TELEGRAM_CHAT:-}
    CW_DOCKER_PREFIX: ${CW_DOCKER_PREFIX:-}
    CW_DOCKER_LABEL: ${CW_DOCKER_LABEL:-}
    CW_SEAT_SUBNETS: ${CW_SEAT_SUBNETS:-}
  user: "${CW_UID:-1000}:${CW_GID:-1000}"

services:
  web:
    <<: *server
    command: ["serve"]
    volumes:
      - .:/app:ro
      - ./data:/app/data
    ports:
      - "${CW_WEB_PORT:-8080}:8080"     # CW_WEB_PORT=10.66.0.2:8090 publishes on that address only
    restart: unless-stopped

  worker:
    <<: *server
    command: ["worker"]
    volumes: &docker_volumes
      - .:/app:ro
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    group_add: &docker_group
      - "${DOCKER_GID:-999}"
    restart: unless-stopped
    stop_grace_period: 30m        # let running games finish (SIGTERM stops new ones)

  cli:
    <<: *server
    volumes: *docker_volumes
    group_add: *docker_group
    profiles: ["cli"]
